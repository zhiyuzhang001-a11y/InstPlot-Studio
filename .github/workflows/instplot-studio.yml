name: InstPlot Studio

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/**"
      - "crates/**"
      - "prototypes/layout-engine-spike/**"
      - "scripts/**"
      - "packaging/**"
      - "adr/**"
      - "docs/**"
      - "LICENSE"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/**"
      - "crates/**"
      - "prototypes/layout-engine-spike/**"
      - "scripts/**"
      - "packaging/**"
      - "adr/**"
      - "docs/**"
      - "LICENSE"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      windows_gui_qa_action:
        description: Isolated Windows GUI QA only (never a production release)
        type: choice
        default: "off"
        options: ["off", build, publish, activate, desktop-smoke]
      windows_gui_qa_identity:
        description: Existing QA artifact identity RUN_ID-ATTEMPT (publish/activate only)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    if: ${{ !inputs.windows_gui_qa_action || inputs.windows_gui_qa_action == 'off' }}
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows also builds two disposable versions and exercises installer recovery.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libwayland-dev

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check repository hygiene
        run: python3 scripts/check_repository_hygiene.py

      - name: Test release metadata tools
        run: python3 -m unittest scripts/test_update_release.py scripts/test_release_tools.py scripts/test_install_studio_macos.py scripts/test_windows_gui_qa.py

      - name: Run all tests and examples
        run: cargo test --workspace --locked --all-targets --all-features --no-fail-fast

      - name: Run documentation tests
        run: cargo test --workspace --locked --doc

      - name: Run promoted A7 compatibility tests
        run: cargo test --manifest-path prototypes/layout-engine-spike/Cargo.toml --locked

      - name: Run Clippy
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: Prove the reusable shell with the second product
        shell: bash
        run: |
          cargo run --locked --package instplot-demo -- \
            apps/instplot-studio/tests/fixtures/smoke.csv \
            field response "Field (mT)" "Signal (a.u.)" target/instplot-demo.svg
          test -s target/instplot-demo.svg

      - name: Build release binary
        run: cargo build --release --locked --package instplot-studio

      - name: Verify embedded Windows product icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify_windows_icon.ps1 -Executable target/release/instplot-studio.exe

      - name: Read product version
        shell: bash
        run: echo "INSTPLOT_VERSION=$(python3 scripts/read_version.py)" >> "${GITHUB_ENV}"

      - name: Generate P0 real-workflow baseline
        run: cargo run --locked --package instplot-studio --example p0_baseline -- target/b5p-p0-ci

      - name: Check product identity
        if: runner.os != 'Windows'
        run: |
          test "$(target/release/instplot-studio --product-info)" = $'InstPlot Studio\tinstplot-studio\t'"${INSTPLOT_VERSION}"
          target/release/instplot-studio --export-fixed-pdf target/b1-fixed.pdf
          test -s target/b1-fixed.pdf
          target/release/instplot-studio --export-fixed-png target/b3-fixed.png
          test -s target/b3-fixed.png
          target/release/instplot-studio --create-project target/b2-ci.instplot
          target/release/instplot-studio --check-project target/b2-ci.instplot
          target/release/instplot-studio --publication-check target/b2-ci.instplot > target/b4-publication-check.json
          test -s target/b4-publication-check.json
          target/release/instplot-studio --create-handoff apps/instplot-studio/tests/fixtures/lite-source-fit.txt target/b5-ci.instplot-handoff
          target/release/instplot-studio --import-handoff target/b5-ci.instplot-handoff target/b5-ci.instplot
          target/release/instplot-studio --check-project target/b5-ci.instplot

      - name: Check Windows product identity and headless export
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/invoke_studio_probe.ps1
          $actual = Invoke-StudioProbe 'target/release/instplot-studio.exe' @('--product-info')
          $expected = "InstPlot Studio`tinstplot-studio`t$env:INSTPLOT_VERSION"
          if ($actual -ne $expected) { throw "Unexpected product identity: $actual" }
          Invoke-StudioProbe 'target/release/instplot-studio.exe' @('--export-fixed-pdf', 'target/b1-fixed.pdf') | Out-Host
          if (-not (Test-Path target/b1-fixed.pdf)) { throw "Headless PDF was not created" }
          if ((Get-Item target/b1-fixed.pdf).Length -lt 1000) { throw "Headless PDF is unexpectedly small" }
          Invoke-StudioProbe 'target/release/instplot-studio.exe' @('--export-fixed-png', 'target/b3-fixed.png') | Out-Host
          if (-not (Test-Path target/b3-fixed.png)) { throw "Headless PNG was not created" }
          if ((Get-Item target/b3-fixed.png).Length -lt 1000) { throw "Headless PNG is unexpectedly small" }
          Invoke-StudioProbe 'target/release/instplot-studio.exe' @('--create-project', 'target/b2-ci.instplot') | Out-Host
          Invoke-StudioProbe 'target/release/instplot-studio.exe' @('--check-project', 'target/b2-ci.instplot') | Out-Host
          Invoke-StudioProbe 'target/release/instplot-studio.exe' @('--publication-check', 'target/b2-ci.instplot') | Out-File -Encoding utf8 target/b4-publication-check.json
          if (-not (Test-Path target/b4-publication-check.json)) { throw "Publication Check report was not created" }
          if ((Get-Item target/b4-publication-check.json).Length -lt 1000) { throw "Publication Check report is unexpectedly small" }
          Invoke-StudioProbe 'target/release/instplot-studio.exe' @('--create-handoff', 'apps/instplot-studio/tests/fixtures/lite-source-fit.txt', 'target/b5-ci.instplot-handoff') | Out-Host
          Invoke-StudioProbe 'target/release/instplot-studio.exe' @('--import-handoff', 'target/b5-ci.instplot-handoff', 'target/b5-ci.instplot') | Out-Host
          Invoke-StudioProbe 'target/release/instplot-studio.exe' @('--check-project', 'target/b5-ci.instplot') | Out-Host

      - name: Build, install, and remove Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          packaging/linux/build_packages.sh
          deb="target/packages/linux/InstPlot-Studio-${INSTPLOT_VERSION}-linux-x86_64.deb"
          sudo apt-get install -y "./${deb}"
          test "$(instplot-studio --product-info)" = $'InstPlot Studio\tinstplot-studio\t'"${INSTPLOT_VERSION}"
          sudo apt-get remove -y instplot-studio
          if command -v instplot-studio; then
            echo "instplot-studio remains on PATH after uninstall" >&2
            exit 1
          fi
          mkdir target/portable-ci
          tar -xzf "target/packages/linux/InstPlot-Studio-${INSTPLOT_VERSION}-linux-x86_64.tar.gz" -C target/portable-ci
          portable="target/portable-ci/InstPlot-Studio-${INSTPLOT_VERSION}-linux-x86_64/bin/instplot-studio"
          test "$("${portable}" --product-info)" = $'InstPlot Studio\tinstplot-studio\t'"${INSTPLOT_VERSION}"

      - name: Build, mount, and verify macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/macos/build_package.py
          dmg="target/packages/macos/InstPlot-Studio-${INSTPLOT_VERSION}-macos-aarch64.dmg"
          mount_point=$(mktemp -d)
          cleanup() { hdiutil detach "${mount_point}" -quiet || true; rmdir "${mount_point}" || true; }
          trap cleanup EXIT
          hdiutil attach "${dmg}" -readonly -nobrowse -mountpoint "${mount_point}" -quiet
          app="${mount_point}/InstPlot Studio.app"
          codesign --verify --deep --strict "${app}"
          test "$(defaults read "${app}/Contents/Info" CFBundleIdentifier)" = "com.instplot.studio"
          test "$(defaults read "${app}/Contents/Info" CFBundleShortVersionString)" = "${INSTPLOT_VERSION}"
          test "$(lipo -archs "${app}/Contents/MacOS/instplot-studio")" = "arm64"
          test "$("${app}/Contents/MacOS/instplot-studio" --product-info)" = $'InstPlot Studio\tinstplot-studio\t'"${INSTPLOT_VERSION}"

      - name: Install pinned Inno Setup when absent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.4.3 --yes --no-progress
          }

      - name: Build, install, and remove Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/build_package.ps1
          $installer = "target/packages/windows/InstPlot-Studio-$env:INSTPLOT_VERSION-windows-x86_64-setup.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "instplot-studio-ci"
          $installProcess = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/TASKS=desktopicon', "/DIR=$installRoot"
          ) -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Installer failed with $($installProcess.ExitCode)" }
          $binary = Join-Path $installRoot "instplot-studio.exe"
          $shortcut = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'InstPlot Studio.lnk'
          ./scripts/verify_windows_icon.ps1 -Executable $binary -Shortcut $shortcut
          . ./scripts/invoke_studio_probe.ps1
          $actual = Invoke-StudioProbe $binary @('--product-info')
          if ($actual -ne "InstPlot Studio`tinstplot-studio`t$env:INSTPLOT_VERSION") { throw "Unexpected installed identity: $actual" }
          $uninstallProcess = Start-Process -FilePath (Join-Path $installRoot "unins000.exe") -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstaller failed with $($uninstallProcess.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path $binary) { throw "Installed binary remains after uninstall" }

      - name: Test Windows installer downgrade and recovery prototype
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_windows_installer_recovery.ps1

      - name: Verify signed metadata for both Windows preview installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:INSTPLOT_WINDOWS_PREVIEW_KIT = (Resolve-Path 'target/windows-update-recovery/preview-kit').Path
          python3 -m unittest scripts.test_update_release.UpdateReleaseTests.test_real_preview_installers_have_verified_signed_fixture_metadata
          if ($LASTEXITCODE -ne 0) { throw 'Windows preview fixture signing verification failed' }

      - name: Upload Windows recovery prototype evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-update-recovery-prototype
          path: target/windows-update-recovery/
          if-no-files-found: warn

  windows-desktop-smoke:
    # Diagnostic only: consume existing exact QA packages, never rebuild/publish.
    if: ${{ inputs.windows_gui_qa_action == 'desktop-smoke' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify real desktop windows for the frozen preview packages
        shell: pwsh
        run: ./scripts/test_windows_desktop_smoke.ps1
      - name: Preserve native window evidence and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-smoke-${{ github.run_id }}
          path: target/windows-desktop-smoke/
          if-no-files-found: error

  windows-gui-qa-build:
    if: ${{ inputs.windows_gui_qa_action == 'build' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify isolated publishing guards
        run: python3 -m unittest scripts.test_windows_gui_qa scripts.test_release_tools.WindowsProbeTests
      - name: Build both isolated preview installers (no installed app changed)
        shell: pwsh
        run: |
          $identity = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $root = "https://instplot-release.oss-cn-beijing.aliyuncs.com/instplot-studio/windows-gui-qa/$identity"
          ./scripts/test_windows_installer_recovery.ps1 -KitOnly -FixturePublicRoot $root
          $source = (git rev-parse HEAD).Trim()
          python3 scripts/windows_gui_qa.py stage --kit target/windows-update-recovery/preview-kit `
            --output target/windows-gui-qa --identity $identity --source-sha $source `
            --private-key $env:INSTPLOT_WINDOWS_PREVIEW_FIXTURE_KEY
          if ($LASTEXITCODE -ne 0) { throw 'Isolated GUI QA signing/staging failed' }
      - name: Upload only public assets and inventory (never private keys)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-gui-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/windows-gui-qa/public/
            target/windows-gui-qa/inventory.json
          if-no-files-found: error
          retention-days: 30

  windows-gui-qa-publish:
    # Main and the existing protected Environment are mandatory. No branch-policy bypass.
    if: ${{ github.ref == 'refs/heads/main' && (inputs.windows_gui_qa_action == 'publish' || inputs.windows_gui_qa_action == 'activate') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: release-production
    concurrency:
      group: studio-windows-gui-qa-${{ inputs.windows_gui_qa_identity }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      QA_IDENTITY: ${{ inputs.windows_gui_qa_identity }}
      QA_ACTION: ${{ inputs.windows_gui_qa_action }}
      GH_TOKEN: ${{ github.token }}
      ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
      ALIYUN_ROLE_ARN: ${{ vars.ALIYUN_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch and validate the exact public QA artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "${QA_IDENTITY}" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          run_id=${QA_IDENTITY%-*}
          source_sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            --jq 'select(.conclusion == "success" and .event == "workflow_dispatch" and .path == ".github/workflows/instplot-studio.yml") | .head_sha')
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --name "windows-gui-qa-${QA_IDENTITY}" --dir target/windows-gui-qa
          test "$(python3 -c 'import json; print(json.load(open("target/windows-gui-qa/public/qa-index.json"))["source_sha"])')" = "${source_sha}"
          python3 scripts/windows_gui_qa.py validate --output target/windows-gui-qa --identity "${QA_IDENTITY}"
      - name: Install pinned ossutil
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/ossutil.zip"
          curl --fail --silent --show-error --location \
            https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip --output "${archive}"
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  ${archive}" | sha256sum --check --strict
          unzip -q "${archive}" -d "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/ossutil-2.3.0-linux-amd64/ossutil" "${RUNNER_TEMP}/ossutil"
      - name: Assume existing OIDC role (no signing secret accessed)
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1
        with:
          oidc-provider-arn: ${{ env.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ env.ALIYUN_ROLE_ARN }}
          role-session-name: studio-gui-qa-${{ github.run_id }}
          role-session-expiration: 900
          audience: sts.aliyuncs.com
      - name: Publish and verify only the run-specific QA prefix
        shell: bash
        run: |
          set -euo pipefail
          export OSS_ACCESS_KEY_ID="${ALIBABA_CLOUD_ACCESS_KEY_ID}"
          export OSS_ACCESS_KEY_SECRET="${ALIBABA_CLOUD_ACCESS_KEY_SECRET}"
          export OSS_SESSION_TOKEN="${ALIBABA_CLOUD_SECURITY_TOKEN}"
          python3 scripts/windows_gui_qa.py "${QA_ACTION}" --output target/windows-gui-qa \
            --identity "${QA_IDENTITY}" --ossutil "${RUNNER_TEMP}/ossutil"
      - name: Preserve public verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-gui-qa-public-verification-${{ github.run_id }}
          path: |
            target/windows-gui-qa/public/qa-index.json
            target/windows-gui-qa/inventory.json
            target/windows-gui-qa/publication-result.json
          if-no-files-found: warn

name: InstPlot Studio

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/**"
      - "crates/**"
      - "prototypes/layout-engine-spike/**"
      - "scripts/**"
      - "packaging/**"
      - "adr/**"
      - "docs/**"
      - "LICENSE"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/**"
      - "crates/**"
      - "prototypes/layout-engine-spike/**"
      - "scripts/**"
      - "packaging/**"
      - "adr/**"
      - "docs/**"
      - "LICENSE"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libwayland-dev

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check repository hygiene
        run: python3 scripts/check_repository_hygiene.py

      - name: Test release metadata tools
        run: python3 -m unittest scripts/test_update_release.py scripts/test_release_tools.py

      - name: Run all tests and examples
        run: cargo test --workspace --locked --all-targets --all-features --no-fail-fast

      - name: Run documentation tests
        run: cargo test --workspace --locked --doc

      - name: Run promoted A7 compatibility tests
        run: cargo test --manifest-path prototypes/layout-engine-spike/Cargo.toml --locked

      - name: Run Clippy
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: Prove the reusable shell with the second product
        shell: bash
        run: |
          cargo run --locked --package instplot-demo -- \
            apps/instplot-studio/tests/fixtures/smoke.csv \
            field response "Field (mT)" "Signal (a.u.)" target/instplot-demo.svg
          test -s target/instplot-demo.svg

      - name: Build release binary
        run: cargo build --release --locked --package instplot-studio

      - name: Read product version
        shell: bash
        run: echo "INSTPLOT_VERSION=$(python3 scripts/read_version.py)" >> "${GITHUB_ENV}"

      - name: Generate P0 real-workflow baseline
        run: cargo run --locked --package instplot-studio --example p0_baseline -- target/b5p-p0-ci

      - name: Check product identity
        if: runner.os != 'Windows'
        run: |
          test "$(target/release/instplot-studio --product-info)" = $'InstPlot Studio\tinstplot-studio\t'"${INSTPLOT_VERSION}"
          target/release/instplot-studio --export-fixed-pdf target/b1-fixed.pdf
          test -s target/b1-fixed.pdf
          target/release/instplot-studio --export-fixed-png target/b3-fixed.png
          test -s target/b3-fixed.png
          target/release/instplot-studio --create-project target/b2-ci.instplot
          target/release/instplot-studio --check-project target/b2-ci.instplot
          target/release/instplot-studio --publication-check target/b2-ci.instplot > target/b4-publication-check.json
          test -s target/b4-publication-check.json
          target/release/instplot-studio --create-handoff apps/instplot-studio/tests/fixtures/lite-source-fit.txt target/b5-ci.instplot-handoff
          target/release/instplot-studio --import-handoff target/b5-ci.instplot-handoff target/b5-ci.instplot
          target/release/instplot-studio --check-project target/b5-ci.instplot

      - name: Check Windows product identity and headless export
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = & target/release/instplot-studio.exe --product-info
          $expected = "InstPlot Studio`tinstplot-studio`t$env:INSTPLOT_VERSION"
          if ($actual -ne $expected) { throw "Unexpected product identity: $actual" }
          & target/release/instplot-studio.exe --export-fixed-pdf target/b1-fixed.pdf
          if (-not (Test-Path target/b1-fixed.pdf)) { throw "Headless PDF was not created" }
          if ((Get-Item target/b1-fixed.pdf).Length -lt 1000) { throw "Headless PDF is unexpectedly small" }
          & target/release/instplot-studio.exe --export-fixed-png target/b3-fixed.png
          if (-not (Test-Path target/b3-fixed.png)) { throw "Headless PNG was not created" }
          if ((Get-Item target/b3-fixed.png).Length -lt 1000) { throw "Headless PNG is unexpectedly small" }
          & target/release/instplot-studio.exe --create-project target/b2-ci.instplot
          & target/release/instplot-studio.exe --check-project target/b2-ci.instplot
          & target/release/instplot-studio.exe --publication-check target/b2-ci.instplot | Out-File -Encoding utf8 target/b4-publication-check.json
          if (-not (Test-Path target/b4-publication-check.json)) { throw "Publication Check report was not created" }
          if ((Get-Item target/b4-publication-check.json).Length -lt 1000) { throw "Publication Check report is unexpectedly small" }
          & target/release/instplot-studio.exe --create-handoff apps/instplot-studio/tests/fixtures/lite-source-fit.txt target/b5-ci.instplot-handoff
          & target/release/instplot-studio.exe --import-handoff target/b5-ci.instplot-handoff target/b5-ci.instplot
          & target/release/instplot-studio.exe --check-project target/b5-ci.instplot

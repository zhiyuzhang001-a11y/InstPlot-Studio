name: Verify Alibaba Cloud OIDC trust

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Obtain short-lived STS credentials
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: release-production
    steps:
      - name: Verify protected OIDC configuration
        env:
          OIDC_PROVIDER_ARN: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          ROLE_ARN: ${{ vars.ALIYUN_ROLE_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${OIDC_PROVIDER_ARN}" ]] || { echo "Missing ALIYUN_OIDC_PROVIDER_ARN" >&2; exit 1; }
          [[ -n "${ROLE_ARN}" ]] || { echo "Missing ALIYUN_ROLE_ARN" >&2; exit 1; }

      - name: Obtain short-lived Alibaba Cloud credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1
        with:
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIYUN_ROLE_ARN }}
          role-session-name: instplot-studio-verify-${{ github.run_id }}
          role-session-expiration: 900
          audience: sts.aliyuncs.com

      - name: Confirm temporary credential shape
        shell: bash
        run: |
          set -euo pipefail
          for name in ALIBABA_CLOUD_ACCESS_KEY_ID ALIBABA_CLOUD_ACCESS_KEY_SECRET \
            ALIBABA_CLOUD_SECURITY_TOKEN; do
            [[ -n "${!name:-}" ]] || { echo "OIDC exchange did not export ${name}" >&2; exit 1; }
          done
          echo "GitHub OIDC successfully obtained short-lived Alibaba Cloud STS credentials." \
            >> "${GITHUB_STEP_SUMMARY}"

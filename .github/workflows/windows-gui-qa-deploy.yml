name: Deploy isolated Windows GUI QA endpoint

on:
  push:
    branches: [main]
    paths: [".github/workflows/windows-gui-qa-deploy.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: Publish baseline first; activate only after the baseline GUI retained recovery metadata
        type: choice
        default: publish
        options: [publish, activate]

permissions:
  contents: read

# This narrow bridge does NOT merge updater implementation into main, create a
# release or build another package. It consumes one frozen, successful QA build.
# Changing this source/artifact pair requires another reviewed workflow change.
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: release-production
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: studio-windows-gui-qa-37791183672-1
      cancel-in-progress: false
    env:
      QA_IDENTITY: 37791183672-1
      QA_SOURCE_SHA: 96430fc97111be14bad508ceb309bfb183afbb22
      QA_ACTION: ${{ inputs.action || 'publish' }}
      GH_TOKEN: ${{ github.token }}
      ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
      ALIYUN_ROLE_ARN: ${{ vars.ALIYUN_ROLE_ARN }}
    steps:
      - name: Check out frozen and already tested QA tools, not an arbitrary branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 96430fc97111be14bad508ceb309bfb183afbb22
          persist-credentials: false
      - name: Verify frozen build provenance and exact public artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${QA_SOURCE_SHA}"
          run_id=${QA_IDENTITY%-*}
          source_sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            --jq 'select(.conclusion == "success" and .event == "workflow_dispatch" and .path == ".github/workflows/instplot-studio.yml") | .head_sha')
          test "${source_sha}" = "${QA_SOURCE_SHA}"
          gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" \
            --name "windows-gui-qa-${QA_IDENTITY}" --dir target/windows-gui-qa
          test "$(python3 -c 'import json; print(json.load(open("target/windows-gui-qa/public/qa-index.json"))["source_sha"])')" = "${QA_SOURCE_SHA}"
          python3 scripts/windows_gui_qa.py validate --output target/windows-gui-qa --identity "${QA_IDENTITY}"
      - name: Install checksum-pinned ossutil
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/ossutil.zip"
          curl --fail --silent --show-error --location \
            https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip --output "${archive}"
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  ${archive}" | sha256sum --check --strict
          unzip -q "${archive}" -d "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/ossutil-2.3.0-linux-amd64/ossutil" "${RUNNER_TEMP}/ossutil"
      - name: Use existing protected OIDC role without a production signing secret
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1
        with:
          oidc-provider-arn: ${{ env.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ env.ALIYUN_ROLE_ARN }}
          role-session-name: studio-gui-qa-${{ github.run_id }}
          role-session-expiration: 900
          audience: sts.aliyuncs.com
      - name: Deploy and verify only the frozen run-specific QA prefix
        shell: bash
        run: |
          set -euo pipefail
          export OSS_ACCESS_KEY_ID="${ALIBABA_CLOUD_ACCESS_KEY_ID}"
          export OSS_ACCESS_KEY_SECRET="${ALIBABA_CLOUD_ACCESS_KEY_SECRET}"
          export OSS_SESSION_TOKEN="${ALIBABA_CLOUD_SECURITY_TOKEN}"
          python3 scripts/windows_gui_qa.py "${QA_ACTION}" --output target/windows-gui-qa \
            --identity "${QA_IDENTITY}" --ossutil "${RUNNER_TEMP}/ossutil"
      - name: Preserve public verification result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-gui-qa-public-verification-${{ github.run_id }}
          path: |
            target/windows-gui-qa/public/qa-index.json
            target/windows-gui-qa/inventory.json
            target/windows-gui-qa/publication-result.json
          if-no-files-found: warn

name: Part A Windows automated audit

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-audit:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned RustSec auditor
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "cargo-audit-v0.22.2.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "cargo-audit-v0.22.2"
          Invoke-WebRequest -Uri "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-pc-windows-msvc-v0.22.2.zip" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = "0a7316540862c13d954f648917ceacca593747baed6eec180fafa590be2710ab"
          if ($actual -ne $expected) {
            throw "cargo-audit archive SHA-256 mismatch: expected $expected, got $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $expanded
          Copy-Item "$expanded/cargo-audit-x86_64-pc-windows-msvc-v0.22.2/cargo-audit.exe" "$env:USERPROFILE/.cargo/bin/cargo-audit.exe"
          cargo audit --version

      - name: Run complete automated Windows scope
        shell: pwsh
        run: ./scripts/audit_part_a.ps1 --automated-only

      - name: Build Windows manual test kit
        shell: pwsh
        run: |
          Push-Location prototypes/ui-shell-spike
          cargo build --release --locked
          Pop-Location

          Push-Location prototypes/export-backend-spike
          cargo run --release --locked --bin generate_fixture -- artifacts
          Pop-Location

          $package = Join-Path $PWD "target/part-a-windows-manual-kit"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "prototypes/ui-shell-spike/target/release/ui-shell-spike.exe" "$package/InstPlot-Studio-Part-A.exe"
          Copy-Item "prototypes/export-backend-spike/artifacts/a4-fixture.pdf" "$package/InstPlot-Studio-Part-A.pdf"
          Copy-Item "reports/WINDOWS_PART_A_MANUAL_CHECKLIST.md" "$package/WINDOWS_PART_A_MANUAL_CHECKLIST.md"
          Copy-Item "prototypes/text-shaping-spike/assets/fonts/GUST-FONT-LICENSE.txt" "$package/GUST-FONT-LICENSE.txt"
          Copy-Item "prototypes/text-shaping-spike/assets/fonts/MANIFEST-TeX-Gyre-Heros.txt" "$package/MANIFEST-TeX-Gyre-Heros.txt"
          Copy-Item "prototypes/text-shaping-spike/assets/fonts/README-TeX-Gyre-Heros.txt" "$package/README-TeX-Gyre-Heros.txt"
          git rev-parse HEAD | Set-Content -Encoding utf8NoBOM "$package/GIT_COMMIT.txt"

          $hashes = Get-ChildItem -File $package |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $hashes | Set-Content -Encoding utf8NoBOM "$package/SHA256SUMS.txt"

      - name: Upload Windows manual test kit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: InstPlot-Studio-Windows-Part-A-manual-kit
          path: target/part-a-windows-manual-kit/
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: part-a-windows-audit
          path: |
            target/part-a-audit/
            target/part-a-validation/
          if-no-files-found: error

[package]
name = "text-shaping-spike"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
parley-candidate = ["dep:parley"]
cosmic-candidate = ["dep:cosmic-text"]

[dependencies]
parley = { version = "0.11.0", optional = true }
cosmic-text = { version = "0.19.0", optional = true, default-features = false, features = ["std", "shape-run-cache"] }
ttf-parser = "0.25.1"

[[bin]]
name = "parley-probe"
path = "src/bin/parley_probe.rs"
required-features = ["parley-candidate"]

[[bin]]
name = "cosmic-probe"
path = "src/bin/cosmic_probe.rs"
required-features = ["cosmic-candidate"]

[package]
name = "export-backend-spike"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
comparison-raster = ["dep:resvg"]

[dependencies]
base64 = "0.22.1"
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
parley = "0.11.1"
png = "0.18.1"
resvg = { version = "0.48.1", optional = true }
studio-render-spike = { path = "../studio-render-spike" }
text-shaping-spike = { path = "../text-shaping-spike" }
tiny-skia = "0.12.0"
ttf-parser = "0.25.1"

[dev-dependencies]
lopdf = "0.45.0"
pdf-extract = "0.12.1"
roxmltree = "0.21.1"

[workspace]
members = ["apps/instplot-studio"]
exclude = [
    "prototypes/export-backend-spike",
    "prototypes/layout-engine-spike",
    "prototypes/plotine-comparison",
    "prototypes/shared-core-consumer-spike",
    "prototypes/studio-render-spike",
    "prototypes/text-shaping-spike",
    "prototypes/ui-shell-spike",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"

[workspace.dependencies]
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
export-backend-spike = { path = "prototypes/export-backend-spike" }
instplot-core = { git = "https://github.com/zhiyuzhang001-a11y/InstPlot-Lite.git", rev = "80ad374044d91dd3c306a384fc7f07ba82cac429" }
instplot-io = { git = "https://github.com/zhiyuzhang001-a11y/InstPlot-Lite.git", rev = "80ad374044d91dd3c306a384fc7f07ba82cac429" }
rfd = { version = "=0.17.2", default-features = false }
studio-render-spike = { path = "prototypes/studio-render-spike" }
ui-shell-spike = { path = "prototypes/ui-shell-spike" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = [
    "apps/instplot-studio",
    "apps/instplot-demo",
    "crates/instplot-export",
    "crates/instplot-layout",
    "crates/instplot-render",
    "crates/instplot-text",
    "crates/instplot-ui",
    "tools/instplot-update-signature",
]
exclude = [
    "prototypes/layout-engine-spike",
    "prototypes/plotine-comparison",
    "prototypes/shared-core-consumer-spike",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"

[workspace.dependencies]
atomicwrites = "=0.4.4"
ed25519-dalek = "=3.0.0"
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
instplot-export = { path = "crates/instplot-export" }
instplot-core = { git = "https://github.com/zhiyuzhang001-a11y/InstPlot-Lite.git", rev = "80ad374044d91dd3c306a384fc7f07ba82cac429" }
instplot-io = { git = "https://github.com/zhiyuzhang001-a11y/InstPlot-Lite.git", rev = "80ad374044d91dd3c306a384fc7f07ba82cac429" }
instplot-layout = { path = "crates/instplot-layout" }
rfd = { version = "=0.17.2", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
semver = "=1.0.28"
sha2 = "=0.10.9"
instplot-render = { path = "crates/instplot-render" }
instplot-text = { path = "crates/instplot-text" }
instplot-ui = { path = "crates/instplot-ui", features = ["publication-stack"] }
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSObject", "NSURL"] }
percent-encoding = "=2.3.2"
url = "=2.5.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

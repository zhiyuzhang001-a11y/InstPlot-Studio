schema_version = 1
corpus_id = "publication-visual-benchmark-v1"
status = "frozen-for-a1"
accessed = "2026-09-20"
image_policy = "Store citations and derived observations only. Do not commit publisher images without verified redistribution rights."
scope = "Two-dimensional curves, scatter, error bars, fits, and experiment/theory comparisons."

[official_constraints]
nature_single_column_mm = 89.0
nature_text_pt = [5.0, 7.0]
nature_line_pt = [0.25, 1.0]
acs_single_column_mm = 82.5
wiley_medical_physics_single_column_mm = 80.0
preferred_vector_text = true

[derived_comparison_ranges]
axes_width_fraction = [0.68, 0.84]
axes_height_fraction = [0.60, 0.80]
marker_to_line_ratio = [3.0, 6.0]
major_ticks_per_axis = [4, 7]
legend_key_to_text_height = [2.0, 4.0]
note = "Initial A1 comparison envelope derived from the cited examples and publisher constraints; A7 will replace estimates with rendered measurement evidence before product defaults freeze."

